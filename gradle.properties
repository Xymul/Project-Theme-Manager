kotlin.code.style=official

# The IntelliJ Platform Gradle Plugin warns that the Kotlin stdlib is added automatically and may
# conflict with the stdlib bundled in the IntelliJ Platform (see https://jb.gg/intellij-platform-kotlin-stdlib).
kotlin.stdlib.default.dependency=false

# ---------------------------------------------------------------------------
# Local, read-only environment configuration for this project.
# Nothing here may be installed into or written to the IDE installation.
# ---------------------------------------------------------------------------

# IntelliJ Platform (SDK) used to compile against: the locally installed IntelliJ IDEA 2026.2.3
# (platform build 262, i.e. the very IDE this plugin is developed for). It is only read by Gradle /
# the IntelliJ Platform Gradle Plugin and requires no download at all.
localIdePath=D:/JetBrains/IntelliJ IDEA 2026.2.3

# Gradle: 9.3.0, from D:/Environment/gradle-9.3.0-bin/gradle-9.3.0 (see .idea/gradle.xml).
# GRADLE_USER_HOME is D:/Environment/gradle.repo.

# Java toolchains available on this machine (comma separated, checked by Gradle).
#   D:/Java/openjdk-25.0.2_windows-x64_bin/jdk-25.0.2 - standalone JDK 25  (target)
#   D:/Java/jdk-23                                    - standalone JDK 23
org.gradle.java.installations.paths=D:/Java/openjdk-25.0.2_windows-x64_bin/jdk-25.0.2,D:/Java/jdk-23

# The IntelliJ Platform is compiled for Java 25 (class file version 69), so the Gradle daemon has to
# run on JDK 25 as well, otherwise the platform classes cannot be read.
org.gradle.java.home=D:/Java/openjdk-25.0.2_windows-x64_bin/jdk-25.0.2
